name: PONO Family Birthday Hub — Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pono-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package public website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the public app
        run: |
          node --check sw.js
          node --check auto-update.js
          node --check scripts/build-pages.mjs
          node scripts/validate-site.mjs
          node scripts/test-auto-update.mjs

      - name: Stage public files only
        run: |
          node scripts/build-pages.mjs
          echo "Publishing only approved public assets and a release marker."

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy website to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
